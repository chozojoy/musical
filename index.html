<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>나는 반딧불 티켓 대시보드</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(31, 41, 55, 0.2); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(75, 85, 99, 0.5); border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.4s ease-out forwards; }
    .slide-up { animation: slideUp 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-[#0b0e14] text-gray-300 antialiased selection:bg-blue-500/30 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // --- STREAMING_CHUNK:Defining SVG Icon Components... ---
    const IconCalendar = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    const IconTicket = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg>;
    const IconChevronLeft = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m15 18-6-6 6-6"></path></svg>;
    const IconChevronRight = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="m9 18 6-6-6-6"></path></svg>;
    const IconBuilding = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M12 6h.01"></path><path d="M12 10h.01"></path><path d="M12 14h.01"></path><path d="M16 10h.01"></path><path d="M16 14h.01"></path><path d="M8 10h.01"></path><path d="M8 14h.01"></path></svg>;
    const IconRefresh = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>;
    const IconAlert = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
    const IconCheck = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path><path d="m9 12 2 2 4-4"></path></svg>;
    const IconClock = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const IconChart = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path></svg>;

    // --- STREAMING_CHUNK:Initializing Date Utility Functions... ---
    const DateUtils = {
      parseISO: (str) => new Date(str + 'T00:00:00'),
      startOfMonth: (d) => new Date(d.getFullYear(), d.getMonth(), 1),
      endOfMonth: (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0),
      startOfWeek: (d) => {
        const date = new Date(d);
        const day = date.getDay();
        date.setDate(date.getDate() - day);
        return date;
      },
      endOfWeek: (d) => {
        const date = new Date(d);
        const day = date.getDay();
        date.setDate(date.getDate() + (6 - day));
        return date;
      },
      addDays: (d, days) => {
        const date = new Date(d);
        date.setDate(date.getDate() + days);
        return date;
      },
      isSameMonth: (d1, d2) => d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth(),
      format: (d, fmt) => {
        const pad = n => n < 10 ? '0'+n : n;
        const yyyy = d.getFullYear();
        const M = d.getMonth() + 1;
        const day = d.getDate();
        const E = ['일','월','화','수','목','금','토'][d.getDay()];
        if (fmt === 'yyyy-MM-dd') return `${yyyy}-${pad(M)}-${pad(day)}`;
        if (fmt === 'yyyy년 M월') return `${yyyy}년 ${M}월`;
        if (fmt === 'M월 d일') return `${M}월 ${day}일`;
        if (fmt === 'E') return E;
        if (fmt === 'd') return day.toString();
        return d.toString();
      }
    };

    // --- STREAMING_CHUNK:Defining Constants and Mocks... ---
    const MOCK_TOTAL_SEATS = { VIP: 336, R: 132 };
    const SHEET_ID = '1VUbfXWt1K3ncF0BN_3kgp7oAKjFgrRh--P1_ImbxvEw';
    const GID_RESERVATIONS = '332906133'; 
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID_RESERVATIONS}&range=B:F&headers=0`;

    const DEFAULT_SCHEDULE_DATA = [
      { date: '2026-09-06', type: 'setup', title: '무대 셋업' },
      { date: '2026-09-07', type: 'setup', title: '무대 셋업' },
      { date: '2026-09-08', type: 'setup', title: '무대 셋업' },
      { date: '2026-10-06', type: 'teardown', title: '무대 철수' },
      { date: '2026-09-14', type: 'off', title: '휴관' },
      { date: '2026-09-15', type: 'off', title: '휴관' },
      { date: '2026-09-21', type: 'off', title: '휴관' },
      { date: '2026-09-22', type: 'off', title: '휴관' },
      { date: '2026-09-25', type: 'holiday', title: '추석', label: '추석' },
      { date: '2026-09-28', type: 'off', title: '휴관' },
      { date: '2026-09-29', type: 'off', title: '휴관' },
      { date: '2026-09-09', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 1, id: 'r1' }] },
      { date: '2026-09-10', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 2, id: 'r2' }] },
      { date: '2026-09-11', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 3, id: 'r3' }] },
      { date: '2026-09-12', type: 'weekend_perf', rounds: [{ time: '11:00', roundNum: 4, id: 'r4' }, { time: '14:00', roundNum: 5, id: 'r5' }, { time: '16:30', roundNum: 6, id: 'r6' }] },
      { date: '2026-09-13', type: 'weekend_perf', rounds: [{ time: '11:00', roundNum: 7, id: 'r7' }, { time: '14:00', roundNum: 8, id: 'r8' }, { time: '16:30', roundNum: 9, id: 'r9' }] },
      { date: '2026-09-16', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 10, id: 'r10' }] },
      { date: '2026-09-17', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 11, id: 'r11' }] },
      { date: '2026-09-18', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 12, id: 'r12' }] },
      { date: '2026-09-19', type: 'weekend_perf', rounds: [{ time: '11:00', roundNum: 13, id: 'r13' }, { time: '14:00', roundNum: 14, id: 'r14' }, { time: '16:30', roundNum: 15, id: 'r15' }] },
      { date: '2026-09-20', type: 'weekend_perf', rounds: [{ time: '11:00', roundNum: 16, id: 'r16' }, { time: '14:00', roundNum: 17, id: 'r17' }, { time: '16:30', roundNum: 18, id: 'r18' }] },
      { date: '2026-09-23', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 19, id: 'r19' }] },
      { date: '2026-09-24', type: 'holiday_perf', label: '추석연휴', rounds: [{ time: '11:00', roundNum: 20, id: 'r20' }, { time: '14:00', roundNum: 21, id: 'r21' }, { time: '16:30', roundNum: 22, id: 'r22' }] },
      { date: '2026-09-26', type: 'holiday_perf', label: '추석연휴', rounds: [{ time: '11:00', roundNum: 23, id: 'r23' }, { time: '14:00', roundNum: 24, id: 'r24' }, { time: '16:30', roundNum: 25, id: 'r25' }] },
      { date: '2026-09-27', type: 'weekend_perf', rounds: [{ time: '11:00', roundNum: 26, id: 'r26' }, { time: '14:00', roundNum: 27, id: 'r27' }, { time: '16:30', roundNum: 28, id: 'r28' }] },
      { date: '2026-09-30', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 29, id: 'r29' }] },
      { date: '2026-10-01', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 30, id: 'r30' }] },
      { date: '2026-10-02', type: 'weekday_perf', rounds: [{ time: '16:00', roundNum: 31, id: 'r31' }] },
      { date: '2026-10-03', type: 'holiday_perf', label: '개천절', rounds: [{ time: '11:00', roundNum: 32, id: 'r32' }, { time: '14:00', roundNum: 33, id: 'r33' }, { time: '16:30', roundNum: 34, id: 'r34' }] },
      { date: '2026-10-04', type: 'weekend_perf', rounds: [{ time: '11:00', roundNum: 35, id: 'r35' }, { time: '14:00', roundNum: 36, id: 'r36' }, { time: '16:30', roundNum: 37, id: 'r37' }] },
      { date: '2026-10-05', type: 'holiday_perf', label: '대체공휴일', rounds: [{ time: '11:00', roundNum: 38, id: 'r38' }, { time: '14:00', roundNum: 39, id: 'r39' }, { time: '16:30', roundNum: 40, id: 'r40' }] },
    ];

    // --- STREAMING_CHUNK:Helper functions for processing stats... ---
    const getDayData = (date, scheduleData) => {
      if (!date || !scheduleData) return null;
      const dateString = DateUtils.format(date, 'yyyy-MM-dd');
      return scheduleData.find(d => d.date === dateString) || null;
    };

    const getRoundStats = (dateString, timeString, reservationsData) => {
      const defaultStats = { usedVIP: 0, usedR: 0, remainingVIP: MOCK_TOTAL_SEATS.VIP, remainingR: MOCK_TOTAL_SEATS.R, details: [], organizations: [] };
      if (!reservationsData || !Array.isArray(reservationsData)) return defaultStats;

      const cleanDate = String(dateString).trim();
      const cleanTime = String(timeString).trim();

      const details = reservationsData.filter(d => d && d.date === cleanDate && d.time === cleanTime);
      if (details.length === 0) return defaultStats;

      const usedVIP = details.reduce((sum, d) => sum + (Number(d?.vipCount) || 0), 0);
      const usedR = details.reduce((sum, d) => sum + (Number(d?.rCount) || 0), 0);
      const uniqueOrgs = [...new Set(details.map(d => d?.user).filter(Boolean))];

      return {
        usedVIP, usedR,
        remainingVIP: Math.max(0, MOCK_TOTAL_SEATS.VIP - usedVIP),
        remainingR: Math.max(0, MOCK_TOTAL_SEATS.R - usedR),
        details, organizations: uniqueOrgs
      };
    };

    const getDailyTotalStats = (dayData, reservationsData) => {
      if (!dayData?.rounds || !Array.isArray(reservationsData)) return null;
      let totalVIPUsed = 0, totalRUsed = 0;
      let dailyOrganizations = new Set();

      dayData.rounds.forEach(r => {
        if (!r?.time) return;
        const stats = getRoundStats(dayData.date, r.time, reservationsData);
        totalVIPUsed += stats.usedVIP;
        totalRUsed += stats.usedR;
        stats.organizations.forEach(org => dailyOrganizations.add(org));
      });

      return { totalVIPUsed, totalRUsed, organizations: Array.from(dailyOrganizations) };
    };

    // --- STREAMING_CHUNK:Component for tooltip card... ---
    const TooltipCard = ({ round, dateData, reservationsData }) => {
      if (!dateData?.date || !round?.time) return null;
      const stats = getRoundStats(dateData.date, round.time, reservationsData);
      const hasReservation = stats.details.length > 0;
      
      return (
        <div className="absolute z-[9999] bottom-full left-1/2 transform -translate-x-1/2 mb-4 hidden group-hover:block w-[18rem] md:w-[22rem] bg-[#1e2330] border border-gray-600 rounded-2xl shadow-[0_30px_60px_-10px_rgba(0,0,0,0.9)] p-4 md:p-5 pointer-events-none scale-95 group-hover:scale-100 transition-all duration-200 origin-bottom">
          <div className="flex justify-between items-center border-b border-gray-700/80 pb-3 mb-4">
            <div className="font-black text-2xl md:text-3xl text-white tracking-tight flex items-center gap-2">
              <IconClock className="w-5 h-5 md:w-6 md:h-6 text-blue-400" />
              <span className="text-blue-400">{round.time}</span>
            </div>
            <div className="text-xs md:text-sm bg-gray-800 border border-gray-600 px-3 py-1 rounded-full text-gray-300 font-bold shadow-inner">
              {round.roundNum}회차
            </div>
          </div>
          <div className="space-y-3 md:space-y-4">
            <div className="bg-gray-900/50 p-3 md:p-4 rounded-xl border border-gray-700/50">
              <div className="flex justify-between items-end mb-2">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.8)]"></span>
                  <span className="font-bold text-gray-300 text-xs md:text-sm">VIP석 잔여</span>
                </div>
                <div className="flex items-baseline gap-1">
                  <span className={`font-black text-2xl md:text-3xl tracking-tighter ${stats.remainingVIP === 0 ? 'text-red-500' : 'text-yellow-500'}`}>{stats.remainingVIP}</span>
                  <span className="text-gray-500 text-xs md:text-sm font-bold">/ {MOCK_TOTAL_SEATS.VIP}</span>
                </div>
              </div>
              <div className="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800">
                 <div className="bg-gradient-to-r from-yellow-600 to-yellow-400 h-full rounded-full" style={{ width: `${(stats.usedVIP / MOCK_TOTAL_SEATS.VIP) * 100}%` }}></div>
              </div>
            </div>
            <div className="bg-gray-900/50 p-3 md:p-4 rounded-xl border border-gray-700/50">
               <div className="flex justify-between items-end mb-2">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.8)]"></span>
                  <span className="font-bold text-gray-300 text-xs md:text-sm">R석 잔여</span>
                </div>
                <div className="flex items-baseline gap-1">
                  <span className={`font-black text-2xl md:text-3xl tracking-tighter ${stats.remainingR === 0 ? 'text-red-500' : 'text-blue-400'}`}>{stats.remainingR}</span>
                  <span className="text-gray-500 text-xs md:text-sm font-bold">/ {MOCK_TOTAL_SEATS.R}</span>
                </div>
              </div>
              <div className="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800">
                 <div className="bg-gradient-to-r from-blue-600 to-blue-400 h-full rounded-full" style={{ width: `${(stats.usedR / MOCK_TOTAL_SEATS.R) * 100}%` }}></div>
              </div>
            </div>
          </div>
          <div className="pt-4 mt-4 md:mt-5 border-t border-gray-700/80">
            {hasReservation ? (
              <>
                <div className="text-xs text-gray-400 mb-2 md:mb-3 flex items-center font-bold">
                  <IconBuilding className="w-3.5 h-3.5 md:w-4 md:h-4 mr-1.5"/> 예약 기관 ({stats.details.length}건)
                </div>
                <div className="space-y-2">
                    {stats.details.slice(0, 3).map((detail, idx) => (
                      <div key={idx} className="flex justify-between items-center bg-[#151720] p-2.5 md:p-3 rounded-xl border border-gray-700 shadow-sm">
                        <span className="truncate w-24 md:w-36 text-xs md:text-sm font-bold text-gray-200">{detail.user}</span>
                        <div className="flex gap-1 flex-shrink-0">
                          {detail.vipCount > 0 && <span className="text-[10px] md:text-[11px] bg-yellow-900/30 text-yellow-500 px-1.5 md:px-2 py-0.5 rounded-md font-bold border border-yellow-800/50">VIP {detail.vipCount}</span>}
                          {detail.rCount > 0 && <span className="text-[10px] md:text-[11px] bg-blue-900/30 text-blue-400 px-1.5 md:px-2 py-0.5 rounded-md font-bold border border-blue-800/50">R {detail.rCount}</span>}
                        </div>
                      </div>
                    ))}
                    {stats.details.length > 3 && (
                      <div className="text-[10px] md:text-xs text-center text-gray-500 pt-2 font-bold">외 {stats.details.length - 3}곳 추가 예약됨</div>
                    )}
                </div>
              </>
            ) : (
              <div className="flex flex-col items-center justify-center text-gray-500 py-3 md:py-4 bg-gray-900/30 rounded-xl border border-dashed border-gray-700">
                <span className="text-xs md:text-sm font-bold">해당 회차 예매 내역 없음</span>
              </div>
            )}
          </div>
        </div>
      );
    };

    // --- STREAMING_CHUNK:Component for single calendar cell... ---
    const CalendarCell = ({ day, monthStart, scheduleData, reservationsData, onSelectDate }) => {
      const isCurrentMonth = DateUtils.isSameMonth(day, monthStart);
      const dayData = getDayData(day, scheduleData);
      
      let cellBg = 'bg-[#1a1d27]';
      let borderCol = 'border-gray-800 hover:border-gray-600';
      let dayNumCol = 'text-gray-300';
      let isPlayDay = false;
      
      if (dayData) {
        if (dayData.type === 'weekday_perf') { borderCol = 'border-yellow-600/30 hover:border-yellow-500'; isPlayDay = true; } 
        else if (dayData.type === 'weekend_perf' || dayData.type === 'holiday_perf') { borderCol = 'border-red-500/30 hover:border-red-400'; isPlayDay = true; } 
        else if (dayData.type === 'setup' || dayData.type === 'teardown' || dayData.type === 'off') { cellBg = 'bg-[#12141c] opacity-60'; borderCol = 'border-gray-800/50'; }
      }

      const dayOfWeek = day.getDay();
      if (dayOfWeek === 0) dayNumCol = 'text-red-400'; 
      else if (dayOfWeek === 6) dayNumCol = 'text-blue-400'; 
      if (dayData?.label) dayNumCol = 'text-red-400'; 

      const dailyStats = getDailyTotalStats(dayData, reservationsData);
      const hasOrganizations = dailyStats?.organizations?.length > 0;

      return (
        <div className={`relative min-h-[120px] md:min-h-[160px] p-2 md:p-4 border ${borderCol} rounded-xl md:rounded-2xl ${cellBg} ${!isCurrentMonth ? 'opacity-20' : ''} transition-all duration-300 ${isPlayDay ? 'hover:shadow-2xl hover:-translate-y-1 hover:z-40 z-10 cursor-pointer' : 'z-0'} flex flex-col group/cell`} onClick={() => isPlayDay && onSelectDate(dayData)}>
          <div className="flex justify-between items-start mb-2 md:mb-3">
            <span className={`font-black ${dayNumCol} text-base md:text-xl`}>{DateUtils.format(day, 'd')}</span>
            {dayData?.label && <span className="text-[9px] md:text-[10px] bg-red-900/60 text-red-200 px-2 py-0.5 md:py-1 rounded-full border border-red-700/50 font-bold tracking-wide shadow-sm hidden sm:block">{dayData.label}</span>}
          </div>
          <div className="flex-grow flex flex-col justify-between h-full relative">
            <div className="space-y-1 md:space-y-1.5 w-full">
              {hasOrganizations && (
                <>
                  {dailyStats.organizations.slice(0, 2).map((org, idx) => (
                    <div key={idx} className="text-[10px] md:text-xs bg-gradient-to-r from-blue-700 to-blue-600 text-white px-1.5 md:px-2.5 py-1 md:py-1.5 rounded-md md:rounded-lg truncate w-full font-bold shadow-md flex items-center border border-blue-500/50">
                      <IconBuilding className="w-3 h-3 md:w-4 md:h-4 mr-1 md:mr-1.5 opacity-90 flex-shrink-0"/> 
                      <span className="truncate drop-shadow-sm">{org}</span>
                    </div>
                  ))}
                  {dailyStats.organizations.length > 2 && (

    const OverallStatsView = ({ reservationsData, onBack }) => {

            <div className="flex items-center gap-3 md:gap-5">
              <button onClick={onBack} className="p-2 md:p-3 bg-gray-800 hover:bg-blue-600 hover:text-white rounded-full transition-all group shadow-lg border border-gray-700 cursor-pointer">
                <IconChevronLeft className="w-5 h-5 md:w-6 md:h-6 group-hover:-translate-x-1 transition-transform" />

              <div>
                <div className="text-gray-400 font-bold mb-1 flex items-center gap-2 text-xs md:text-sm"><IconCalendar className="w-3 h-3 md:w-4 md:h-4" /> 캘린더로 돌아가기</div>

    // --- STREAMING_CHUNK:Main Application Component (State & Layout)... ---
    function App() {
      const [currentDate, setCurrentDate] = useState(DateUtils.parseISO('2026-09-01'));
      const [selectedDateData, setSelectedDateData] = useState(null);
      const [showOverallStats, setShowOverallStats] = useState(false);
      
      const [reservationsData, setReservationsData] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('idle');
      const [errorMsg, setErrorMsg] = useState('');

      const monthStart = DateUtils.startOfMonth(currentDate);
      const monthEnd = DateUtils.endOfMonth(monthStart);
      const startDate = DateUtils.startOfWeek(monthStart);
      const endDate = DateUtils.endOfWeek(monthEnd);

      const days = [];
      let day = startDate;
      while (day <= endDate) { days.push(day); day = DateUtils.addDays(day, 1); }

      const totalSummary = useMemo(() => {
        if (!Array.isArray(reservationsData)) return { vip: 0, r: 0 };
        return reservationsData.reduce((acc, curr) => {
          acc.vip += (Number(curr?.vipCount) || 0);
          acc.r += (Number(curr?.rCount) || 0);
          return acc;
        }, { vip: 0, r: 0 });
      }, [reservationsData]);

      // --- STREAMING_CHUNK:JSONP logic to bypass CORS for local HTML execution... ---
      const fetchGoogleSheetData = useCallback(() => {
        setIsSyncing(true); setSyncStatus('idle'); setErrorMsg(''); 
        
        const callbackName = 'gvizCallback_' + Math.round(Math.random() * 1000000);
        
        window[callbackName] = function(data) {
          try {
            if (!data?.table?.rows) throw new Error("시트에 표 데이터가 없습니다.");

            const parsedData = data.table.rows.map((row) => {
              if (!row || !row.c) return null;
              
              let dateStr = "";
              let rawDate = (row.c[0]?.f || row.c[0]?.v || "").toString().trim();
              const dateObjMatch = rawDate.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
              if (dateObjMatch) {
                  dateStr = `${dateObjMatch[1]}-${String(Number(dateObjMatch[2]) + 1).padStart(2, '0')}-${String(dateObjMatch[3]).padStart(2, '0')}`;
              } else {
                  const textMatch = rawDate.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
                  if (textMatch) { dateStr = `${textMatch[1]}-${textMatch[2].padStart(2, '0')}-${textMatch[3].padStart(2, '0')}`; }
              }

              let timeStr = "";
              let rawTime = (row.c[1]?.f || row.c[1]?.v || "").toString().trim();
              const timeMatch = rawTime.match(/(\d{1,2}):(\d{2})/);
              if (timeMatch) timeStr = `${timeMatch[1].padStart(2, '0')}:${timeMatch[2]}`;
              
              const user = (row.c[2]?.v || "").toString().trim();
              const vipCount = Number((row.c[3]?.v || "").toString().replace(/[^0-9]/g, '')) || 0; 
              const rCount = Number((row.c[4]?.v || "").toString().replace(/[^0-9]/g, '')) || 0; 

              if (dateStr && dateStr.length === 10 && timeStr && user && (vipCount > 0 || rCount > 0)) {
                 return { date: dateStr, time: timeStr, user, vipCount, rCount };
              }
              return null;
            }).filter(Boolean);

            setReservationsData(parsedData);
            setSyncStatus(parsedData.length === 0 ? 'error' : 'success');
            if (parsedData.length === 0) setErrorMsg('시트를 불러왔으나, 캘린더에 표시할 예약 내역이 0건입니다.');
          } catch (error) {
            setSyncStatus('error'); setErrorMsg(error.message); setReservationsData([]); 
          } finally {
            setIsSyncing(false); delete window[callbackName];
          }
        };

        const script = document.createElement('script');
        script.src = `${GVIZ_URL}&tq=&tqx=responseHandler:${callbackName}`;
        script.onerror = () => {
            setSyncStatus('error'); setErrorMsg('구글 시트 접근 거부 (공유 권한을 확인하세요).'); setIsSyncing(false); delete window[callbackName];
        };
        document.head.appendChild(script);
      }, []);

      useEffect(() => { fetchGoogleSheetData(); }, [fetchGoogleSheetData]);

      // --- STREAMING_CHUNK:Rendering Main UI Components... ---
      return (
        <div className="max-w-[1400px] mx-auto relative z-10 p-3 md:p-6 lg:p-8">
          {syncStatus === 'error' && (
            <div className="mb-4 md:mb-6 bg-red-900/30 border border-red-500/50 rounded-xl p-3 md:p-5 flex items-start gap-3 shadow-xl animate-in">
              <IconAlert className="text-red-500 w-5 h-5 flex-shrink-0 mt-0.5" />
              <div>
                <h3 className="text-red-400 font-bold text-sm md:text-lg mb-1">데이터 연동 알림</h3>
                <p className="text-red-200/80 text-xs md:text-sm font-medium">{errorMsg}</p>
              </div>
            </div>
          )}

          {showOverallStats ? (
            <OverallStatsView reservationsData={reservationsData} onBack={() => setShowOverallStats(false)} />
          ) : !selectedDateData ? (
            <div className="animate-in">
              <div className="flex flex-col xl:flex-row xl:items-end justify-between mb-6 md:mb-8 gap-4 border-b border-gray-800/80 pb-6 md:pb-8">
                <div className="flex flex-col gap-2">
                  <div className="flex items-center gap-2 text-blue-400 font-bold text-xs md:text-sm"><IconTicket className="w-4 h-4 md:w-5 md:h-5" /> MUSICAL TICKET DASHBOARD</div>
                  <h1 className="text-2xl md:text-5xl font-black tracking-tight text-white flex flex-wrap items-center gap-2 md:gap-4">
                    나는 반딧불 <span className="text-gray-700 font-light text-2xl md:text-5xl hidden sm:inline">|</span> 
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-yellow-500 to-yellow-200">예약 현황판</span>
                  </h1>
                  
                  <div className="flex flex-wrap items-center gap-2 md:gap-4 mt-2 md:mt-4">
                    <button onClick={fetchGoogleSheetData} disabled={isSyncing} className={`flex items-center gap-1.5 md:gap-2 px-3 md:px-5 py-2 md:py-2.5 rounded-full border transition-all shadow-md cursor-pointer ${isSyncing ? 'bg-blue-900/30 border-blue-800 text-blue-400' : 'bg-[#151720] border-gray-700 text-gray-300 hover:bg-gray-800 hover:text-white'}`}>
                      <IconRefresh className={`w-3.5 h-3.5 md:w-4 md:h-4 ${isSyncing ? 'animate-spin' : ''}`} />
                      <span className="text-xs md:text-sm font-bold">{isSyncing ? '갱신 중' : '새로고침'}</span>
                      {!isSyncing && syncStatus === 'success' && <IconCheck className="w-4 h-4 text-green-500 hidden sm:block" />}
                    </button>
                    <button onClick={() => setShowOverallStats(true)} className="bg-gray-900 hover:bg-gray-800 border border-gray-700 px-3 md:px-5 py-2 md:py-2.5 rounded-full flex items-center gap-2 md:gap-4 shadow-inner text-xs md:text-sm font-bold cursor-pointer transition-colors group">
                       <span className="flex items-center gap-1.5 text-gray-400 group-hover:text-white transition-colors"><IconChart className="w-3.5 h-3.5"/> 통계 현황</span>
                       <span className="w-px h-3 md:h-4 bg-gray-700 hidden sm:block"></span>
                       <span className="text-yellow-500 flex items-center gap-1">VIP <span className="text-white text-sm md:text-lg">{totalSummary.vip}</span></span>
                       <span className="text-blue-400 flex items-center gap-1">R <span className="text-white text-sm md:text-lg">{totalSummary.r}</span></span>
                    </button>
                  </div>
                </div>
                
                <div className="flex flex-col items-center sm:items-end gap-3 md:gap-5 bg-[#12141c] p-3 md:p-5 rounded-2xl border border-gray-800 shadow-xl w-full xl:min-w-[320px]">
                  <div className="flex gap-3 text-[10px] md:text-sm font-bold text-gray-400 w-full justify-center">
                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 md:w-3.5 md:h-3.5 bg-yellow-600/30 rounded border border-yellow-700/50"></div>평일</div>
                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 md:w-3.5 md:h-3.5 bg-red-500/30 rounded border border-red-700/50"></div>휴일</div>
                    <div className="flex items-center gap-1.5"><div className="w-2.5 h-2.5 md:w-3.5 md:h-3.5 bg-gray-800 rounded border border-gray-700"></div>휴관</div>
                  </div>
                  <div className="flex items-center gap-2 bg-gray-900 p-1.5 md:p-2 rounded-xl border border-gray-700 shadow-inner w-full justify-between">
                      <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() - 1)))} className="p-1.5 md:p-2 hover:bg-gray-700 hover:text-white rounded-lg text-gray-400 cursor-pointer"><IconChevronLeft className="w-5 h-5"/></button>
                      <span className="font-black text-lg md:text-2xl text-white tracking-tight">{DateUtils.format(currentDate, "yyyy년 M월")}</span>
                      <button onClick={() => setCurrentDate(new Date(currentDate.setMonth(currentDate.getMonth() + 1)))} className="p-1.5 md:p-2 hover:bg-gray-700 hover:text-white rounded-lg text-gray-400 cursor-pointer"><IconChevronRight className="w-5 h-5"/></button>
                  </div>
                </div>
              </div>

              <div className="bg-[#12141c]/80 backdrop-blur-sm p-2 md:p-6 lg:p-8 rounded-2xl md:rounded-[2rem] border border-gray-800/80 shadow-2xl">
                <div className="grid grid-cols-7 gap-2 md:gap-4 mb-3 md:mb-6">
                  {['일', '월', '화', '수', '목', '금', '토'].map((wd, i) => (
                    <div key={wd} className={`text-center font-black text-xs md:text-lg pb-2 md:pb-4 border-b-2 border-gray-800/50 ${i === 0 ? 'text-red-500' : i === 6 ? 'text-blue-500' : 'text-gray-500'}`}>{wd}</div>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-1.5 md:gap-4">
                  {days.map((day) => (
                    <CalendarCell key={day.toString()} day={day} monthStart={monthStart} scheduleData={DEFAULT_SCHEDULE_DATA} reservationsData={reservationsData} onSelectDate={setSelectedDateData} />
                  ))}
                </div>
              </div>
            </div>
          ) : (
            <DetailsView data={selectedDateData} reservationsData={reservationsData} onBack={() => setSelectedDateData(null)} />
          )}
        </div>
      );
    }

    // --- STREAMING_CHUNK:Mounting React Application... ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
